name: Phone apps build
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npx cap sync android
      - run: cd android && ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: imaloo-android
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx cap sync ios
      - name: Build for iPhone simulator (no Apple account needed yet)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
