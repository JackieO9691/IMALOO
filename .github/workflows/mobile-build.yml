name: Phone apps build
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also sign the iPhone app and send it to TestFlight'
        type: boolean
        default: false
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npx cap sync android
      - name: Use the Play upload key if it is set up
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > $RUNNER_TEMP/upload.jks
            echo "IMALOO_KEYSTORE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
            echo "IMALOO_KEYSTORE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
          fi
      - run: cd android && ./gradlew assembleDebug bundleRelease
        env: { BUILD_NUMBER: '${{ github.run_number }}' }
      - name: Remove the key
        if: always()
        run: rm -f $RUNNER_TEMP/upload.jks
      - uses: actions/upload-artifact@v4
        with:
          name: imaloo-android
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx cap sync ios
      - name: Build for iPhone simulator (no Apple account needed yet)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20

  # Signed iPhone build sent to TestFlight. Runs only when started by hand with "testflight" ticked.
  # Needs these repository secrets (never put them in the code):
  #   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the whole text of the AuthKey .p8 file)
  ios-testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    defaults: { run: { working-directory: mobile } }
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Use the newest Xcode (Apple needs Xcode 26 or later)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Check the Apple secrets are there
        run: |
          for v in TEAM KEY_ID ISSUER; do [ -n "${!v}" ] || { echo "Missing secret for $v"; exit 1; }; done
      - name: Put the App Store Connect key in place
        env: { P8: '${{ secrets.ASC_KEY_P8 }}' }
        run: |
          [ -n "$P8" ] || { echo "Missing secret ASC_KEY_P8"; exit 1; }
          mkdir -p ~/private_keys
          # Tidy the pasted key (Windows line endings, missing or squashed header lines) into a clean PEM file.
          printf '%s' "$P8" | python3 -c '
          import sys, re, textwrap
          t = sys.stdin.read().replace("\r", "")
          t = re.sub(r"-----(BEGIN|END) [A-Z ]*-----", " ", t)
          b = re.sub(r"[^A-Za-z0-9+/=]", "", t)
          print("key text found:", len(b), "characters (a real key is about 200)", file=sys.stderr)
          print("-----BEGIN PRIVATE KEY-----"); print("\n".join(textwrap.wrap(b, 64))); print("-----END PRIVATE KEY-----")
          ' > ~/private_keys/AuthKey_$KEY_ID.p8
          echo "KEY_PATH=$HOME/private_keys/AuthKey_$KEY_ID.p8" >> $GITHUB_ENV
      - run: npm ci && npx cap sync ios
      - name: Check Apple has the IMALOO app set up
        run: |
          pip3 install -q --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install -q pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, jwt, urllib.request
          tok = jwt.encode({"iss": os.environ["ISSUER"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           open(os.environ["KEY_PATH"]).read(), algorithm="ES256", headers={"kid": os.environ["KEY_ID"]})
          def get(path):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, headers={"Authorization": "Bearer " + tok})
              return json.load(urllib.request.urlopen(r))
          ids = get("/v1/bundleIds?filter[identifier]=au.com.imaloo.app")["data"]
          if not ids:
              body = json.dumps({"data": {"type": "bundleIds", "attributes": {"identifier": "au.com.imaloo.app", "name": "IMALOO", "platform": "IOS"}}}).encode()
              r = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/bundleIds", data=body, method="POST",
                                         headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              urllib.request.urlopen(r); print("Registered the App ID au.com.imaloo.app")
              ids = get("/v1/bundleIds?filter[identifier]=au.com.imaloo.app")["data"]
          apps = get("/v1/apps?filter[bundleId]=au.com.imaloo.app")["data"]
          print("App ID registered:", bool(ids), "| App Store Connect app made:", bool(apps))
          for a in apps: print("App name:", a["attributes"]["name"])
          if not apps: raise SystemExit("The IMALOO app is not set up in App Store Connect yet (Apps > + > New App, bundle ID au.com.imaloo.app).")
          PY
      # Build unsigned first; the upload step signs it for the App Store with Apple's
      # cloud certificates (no test devices or Mac needed).
      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/IMALOO.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive 2>&1 | tail -80
      - name: Sign and send to App Store Connect (TestFlight)
        run: |
          set -o pipefail
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/IMALOO.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" 2>&1 | tail -80
      - name: Show Apple's upload log if it failed
        if: failure()
        run: |
          for f in $(find /var/folders "$TMPDIR" -path '*xcdistributionlogs*' -name '*.log' 2>/dev/null | sort -u); do
            echo "=== $f"; grep -v '^\s*$' "$f" | grep -iE 'error|fail|denied|not found|unable|could not|status' | tail -40; done
      - name: Remove the key
        if: always()
        run: rm -rf ~/private_keys
